<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3MILIONAIRE</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1560BD;
      --red:  #C0192B;
    }

    html, body {
      height: 100%;
      background: #fff;
      color: #111;
      font-family: 'Times New Roman', Times, serif;
    }

    .site {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      text-align: center;
    }

    /* ── TOP: title ──────────────────────────────────────── */
    .top {
      padding: 3rem 2rem 0;
      animation: fadeUp 1s ease 0.1s both;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: bold;
      letter-spacing: 0.06em;
      line-height: 1;
      color: #111;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.9rem 0 0;
    }
    .stars span {
      color: var(--red);
      font-size: 0.65rem;
      display: inline-block;
      animation: twinkle 3s ease-in-out infinite;
    }
    .stars span:nth-child(2) { animation-delay: 0.5s; }
    .stars span:nth-child(3) { animation-delay: 1s; }

    /* ── MIDDLE: coming soon ─────────────────────────────── */
    .middle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeUp 1s ease 0.4s both;
    }

    .coming-soon {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #111;
      margin-bottom: 0.6rem;
    }

    .latin {
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.06em;
      color: #999;
      animation: fadeUp 1s ease 0.65s both;
    }

    .latin-translation {
      margin-top: 0.3rem;
      font-size: 0.65rem;
      font-style: normal;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #CCC;
      animation: fadeUp 1s ease 0.85s both;
    }

    .x-link {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #111;
      transition: opacity 0.2s;
    }
    .x-link:hover { opacity: 0.6; }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 1rem;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: #BBB;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <div class="site">

    <div class="top">
      <h1>3MILIONAIRE</h1>
      <div class="stars">
        <span>★</span><span>★</span><span>★</span>
      </div>
    </div>

    <div class="middle">
      <p class="coming-soon">Coming Soon</p>
      <p class="latin">Veni, vidi, vici</p>
      <p class="latin-translation">I came, I saw, I conquered</p>
    </div>

  </div>

  <footer>&copy; 2025 3Milionaire &mdash; All rights reserved</footer>
</body>
</html>
